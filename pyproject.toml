[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["orchestrator*", "jarvis*"]

[project]
name = "nexus-orchestrator"
version = "0.1.0"
description = "Enterprise Multi-Agent Orchestration Platform"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "python-dotenv",
    "chromadb",
    "pypdf",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
orchestrator = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "redis[hiredis]>=5.2.0",
    "asyncpg>=0.30.0",
    "aiokafka>=0.12.0",
]
rag = [
    "python-docx>=1.0.0",
]
jarvis = [
    "SpeechRecognition>=3.10.0",
    "PyAudio>=0.2.14",
    "pyttsx3>=2.90",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "fakeredis[lua]>=2.0",
    "httpx>=0.27.0",
]

[project.scripts]
nexus = "orchestrator.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
